name: Bijoy Compatibility Suite

on:
  push:
    branches: [main, 'test/**']
    paths:
      - 'assets/js/kajersathi-bijoy-engine.js'
      - 'tests/**'
      - '.github/workflows/bijoy-compatibility.yml'
  pull_request:
    branches: [main]
    paths:
      - 'assets/js/kajersathi-bijoy-engine.js'
      - 'tests/**'
      - '.github/workflows/bijoy-compatibility.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run compatibility suite
        run: node --test tests/bijoy-compatibility.test.cjs tests/bijoy-roundtrip.test.cjs
