name: Bijoy Conversion Regression Tests

on:
  push:
    branches: [main, "fix/**"]
  pull_request:
    branches: [main]

jobs:
  bijoy-roundtrip:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run Unicode ↔ Bijoy regression tests
        run: node --test tests/bijoy-roundtrip.test.cjs
